services:
  homebridge:
    image: oznu/homebridge:latest
    container_name: homebridge
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/homebridge:/homebridge
    environment:
      TZ: "Europe/Berlin"
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

